<rect x="330" y="98" width="130" height="24" rx="12" fill="#10351f"/><text x="395" y="115" fill="#4ade80" font-size="13" text-anchor="middle">@aayra101</text>
<g class="row" style="animation-delay:0.50s"><text class="lbl" x="330" y="156">Subject</text><line x1="403" x2="684" y1="152" y2="152" stroke="#3b3f7a" stroke-dasharray="1 5" stroke-linecap="round"/><text class="val" x="800" y="156">Aayra Gupta</text></g>
