<g class="row" style="animation-delay:3.20s"><text class="lbl" x="330" y="336">Status</text><line x1="394" x2="524" y1="332" y2="332" stroke="#3b3f7a" stroke-dasharray="1 5" stroke-linecap="round"/><text class="val" x="800" y="336">Learning + Building + Shipping</text></g>
<g class="row" style="animation-delay:3.65s"><text class="lbl" x="330" y="366">Grid.GitHub</text><line x1="436" x2="709" y1="362" y2="362" stroke="#3b3f7a" stroke-dasharray="1 5" stroke-linecap="round"/><text class="val" x="800" y="366">aayra101</text></g>
<text x="330" y="398" fill="#a78bfa" font-size="14">$</text><text x="346" y="398" fill="#f1f5f9" font-size="14">hire --aayra</text><rect class="cur" x="442" y="386" width="8" height="15" fill="#a78bfa"/>
