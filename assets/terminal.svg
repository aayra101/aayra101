<svg xmlns="http://www.w3.org/2000/svg" width="840" height="410" viewBox="0 0 840 410" role="img" aria-label="Aayra Gupta terminal profile card" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<style>
text{font-family:'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace}
.lbl{fill:#8b93c9;font-size:14px}
.val{fill:#f1f5f9;font-size:14px;font-weight:600;text-anchor:end}
.row{opacity:0;animation:in .5s ease-out forwards}
@keyframes in{from{opacity:0;transform:translateX(-14px)}to{opacity:1;transform:translateX(0)}}
.live{animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
.scan{animation:scan 3.2s linear infinite}
@keyframes scan{0%{transform:translateY(0);opacity:0}10%{opacity:.9}90%{opacity:.9}100%{transform:translateY(270px);opacity:0}}
.cur{animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.twk{animation:tw 2.4s ease-in-out infinite}
@keyframes tw{0%,100%{opacity:.15}50%{opacity:1}}
</style>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#120a2e"/><stop offset="1" stop-color="#070a1c"/></linearGradient>
<linearGradient id="ag" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#a78bfa"/><stop offset="1" stop-color="#38bdf8"/></linearGradient>
<pattern id="dots" width="12" height="12" patternUnits="userSpaceOnUse"><circle cx="6" cy="6" r="1.3" fill="#6d4aff" opacity=".55"/></pattern>
<clipPath id="map"><rect x="30" y="76" width="250" height="290"/></clipPath>
</defs>
<rect width="840" height="410" rx="16" fill="url(#bg)" stroke="#2a2260"/>
<rect width="840" height="44" rx="16" fill="#0f0b26"/><rect y="28" width="840" height="16" fill="#0f0b26"/>
<circle cx="26" cy="22" r="6" fill="#ff5f56"/><circle cx="46" cy="22" r="6" fill="#ffbd2e"/><circle cx="66" cy="22" r="6" fill="#27c93f"/>
<text x="420" y="27" fill="#8b93c9" font-size="13" text-anchor="middle">aayra.sh --live</text>
<text x="30" y="68" fill="#38bdf8" font-size="11" letter-spacing="3">VISUAL.MAP</text>
<rect x="30" y="76" width="250" height="290" fill="#0a0820" stroke="#3b2f8f"/>
<rect x="30" y="76" width="250" height="290" fill="url(#dots)"/>
<g clip-path="url(#map)">
<text x="155" y="262" font-size="110" font-weight="800" text-anchor="middle" fill="url(#ag)" opacity=".95">AG</text>
<rect class="scan" x="30" y="76" width="250" height="3" fill="#a78bfa"/>
<circle class="twk" cx="64" cy="108" r="2.5" fill="#fff"/><circle class="twk" style="animation-delay:.7s" cx="240" cy="140" r="2" fill="#fff"/><circle class="twk" style="animation-delay:1.3s" cx="90" cy="330" r="2.2" fill="#fff"/><circle class="twk" style="animation-delay:1.9s" cx="250" cy="320" r="2.5" fill="#fff"/>
</g>
<text x="330" y="86" fill="#38bdf8" font-size="14" font-weight="700" letter-spacing="3">SYSTEM.INFO</text>
