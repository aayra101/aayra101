<g class="row" style="animation-delay:1.40s"><text class="lbl" x="330" y="216">Core.Lang</text><line x1="420" x2="726" y1="212" y2="212" stroke="#3b3f7a" stroke-dasharray="1 5" stroke-linecap="round"/><text class="val" x="800" y="216">Python</text></g>
<g class="row" style="animation-delay:1.85s"><text class="lbl" x="330" y="246">Practice</text><line x1="411" x2="692" y1="242" y2="242" stroke="#3b3f7a" stroke-dasharray="1 5" stroke-linecap="round"/><text class="val" x="800" y="246">DSA in C++</text></g>
<g class="row" style="animation-delay:2.30s"><text class="lbl" x="330" y="276">Building</text><line x1="411" x2="482" y1="272" y2="272" stroke="#3b3f7a" stroke-dasharray="1 5" stroke-linecap="round"/><text class="val" x="800" y="276">ODIN · Suraksha360 · RecruiterAgent</text></g>
